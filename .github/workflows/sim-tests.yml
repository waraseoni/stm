name: sim-tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install simulator dependencies
        run: python -m pip install -r sim/requirements.txt

      - name: Run simulator unit tests
        env:
          PYTHONPATH: sim
        run: python -m unittest discover -s sim/tests -t sim -v